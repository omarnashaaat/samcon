<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--ink:#16324a;--brand:#17587a;--line:#cfd8e1;--surround:#e6ebf0;--accent:#f2b705}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surround:#11181f}}
:root[data-theme="dark"]{--surround:#11181f}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--surround);font-family:Cairo,Tahoma,Arial,sans-serif;color:var(--ink)}
.brand{background:#fff;border-bottom:1px solid var(--line);padding:8px 14px 6px;text-align:center}
.brand img{display:block;margin:0 auto;width:100%;max-width:752px;height:auto}
.tabs{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;background:var(--ink);padding:calc(8px + env(safe-area-inset-top,0px)) 10px 0}
.tab{font:700 15px Cairo,Tahoma,Arial,sans-serif;padding:9px 22px;border:0;border-radius:8px 8px 0 0;background:transparent;color:#dbe7f1;cursor:pointer}
.tab:hover{background:rgba(255,255,255,.12)}
.tab[aria-selected="true"]{background:var(--surround);color:var(--ink)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.views{flex:1;min-height:0;position:relative}
.views iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--surround)}
.views iframe[hidden]{display:none}
@media (max-width:520px){.tab{padding:8px 12px;font-size:13.5px}.brand{padding:6px 8px 4px}}
</style>
</head>

03c/span>\u003cspan>المدير المالي\u003c/span>\n      \u003c/div>\n\n      \u003cdiv class=\"foot\">\n        \u003cdiv>Building 8, Gate 9, Beverly Hills, Sheikh Zayed – Giza\u003c/div>\n        \u003cdiv class=\"contact\">\n          \u003cdiv>\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1.5 2 7.5 5.5L19.5 7z\"/>\u003c/svg>info@samconeg.com\u003c/div>\n          \u003cdiv>\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 9h-3a15 15 0 0 0-1.2-5.2A8 8 0 0 1 18.9 11zM12 4c.8 1 1.6 3.2 1.9 7h-3.8C10.4 7.2 11.2 5 12 4zM9.3 5.8A15 15 0 0 0 8.1 11h-3a8 8 0 0 1 4.2-5.2zM5.1 13h3a15 15 0 0 0 1.2 5.2A8 8 0 0 1 5.1 13zm5 0h3.8c-.3 3.8-1.1 6-1.9 7-.8-1-1.6-3.2-1.9-7zm5.6 5.2A15 15 0 0 0 16.9 13h3a8 8 0 0 1-4.2 5.2z\"/>\u003c/svg>www.samconeg.com\u003c/div>\n          \u003cdiv>\u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\">\u003cpath d=\"M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.400 11.400 0 0 0 3.600.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.500a1 1 0 0 1 1 1c0 1.300.2 2.500.6 3.600a1 1 0 0 1-.25 1z\"/>\u003c/svg>15945\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"overlay\">\u003c/div>\n\n\u003cscript>\n(function () {\n  var KEY = 'samcon_journal_v1';\n  var $ = function (id) { return document.getElementById(id); };\n  var mem = null;          // fallback if storage is unavailable\n  var entries = [];\n  var current = null;      // entry object being edited\n  var isNew = false;\n  var dirty = false;\n\n  /* ---------- storage ---------- */\n  function seed() {\n    return [{\n      id: 'e17056', no: '17056', order: '', date: today(), user: 'عمر محمد نشأت',\n      desc: 'ملئ اسطوانة اكسجين + ثاني اكسيد الكربون', posted: false,\n      rows: [\n        { acc: 'موردون', cus: '', sup: 'شركة المهندس حسام الدين للصناعات', dr: '1231.2', cr: '', emp: '', cc: 'سام اسكويد' },\n        { acc: 'ضريبة القيمة المضافة للموردات', cus: '', sup: 'شركة المهندس حسام الدين للصناعات', dr: '', cr: '151.2', emp: '', cc: '' },\n        { acc: 'عهدة احمد محمد فتوى', cus: '', sup: 'شركة المهندس حسام الدين للصناعات', dr: '', cr: '1080', emp: '', cc: '' }\n      ]\n    }];\n  }\n  function load() {\n    var raw = null;\n    try { raw = localStorage.getItem(KEY); } catch (e) { raw = mem; }\n    if (raw) { try { var a = JSON.parse(raw); if (Array.isArray(a)) return a; } catch (e) {} }\n    return seed();\n  }\n  function persist() {\n    var s = JSON.stringify(entries);\n    try { localStorage.setItem(KEY, s); } catch (e) { mem = s; }\n  }\n\n  /* ---------- helpers ---------- */\n  function parse(t) {\n    var s = String(t == null ? '' : t).replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 1632; })\n      .replace(/[٫]/g, '.').replace(/[,،\\s]/g, '');\n    var n = parseFloat(s); return isNaN(n) ? 0 : n;\n  }\n  function fmt(n) { return (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 }); }\n  function totals(e) {\n    var d = 0, c = 0;\n    e.rows.forEach(function (r) { d += parse(r.dr); c += parse(r.cr); });\n    return { dr: Math.round(d * 100) / 100, cr: Math.round(c * 100) / 100 };\n  }\n  function balanced(e) { var t = totals(e); return Math.abs(t.dr - t.cr) \u003c 0.005; }\n  function today() {\n    var d = new Date(), p = function (n) { return (n \u003c 10 ? '0' : '') + n; };\n    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());\n  }\n  function nextNo() {\n    var m = 0;\n    entries.forEach(function (e) { var n = parseInt(e.no, 10); if (!isNaN(n) && n > m) m = n; });\n    return String(m ? m + 1 : 1);\n  }\n  function el(tag, cls, text) {\n    var x = document.createElement(tag);\n    if (cls) x.className = cls;\n    if (text != null) x.textContent = text;\n    return x;\n  }\n  function toast(msg) {\n    var t = el('div', 'toast', msg); t.setAttribute('role', 'status');\n    document.body.appendChild(t);\n    setTimeout(function () { t.remove(); }, 2400);\n  }\n  function cloneEntry(src, mode) {\n    var rows = src.rows.map(function (r) {\n      var x = {}; for (var k in r) x[k] = r[k];\n      if (mode === 'reverse') { x.dr = r.cr; x.cr = r.dr; }\n      return x;\n    });\n    return {\n      id: 'e' + Date.now(), no: nextNo(), order: '', date: today(), user: src.user, posted: false, rows: rows,\n      desc: mode === 'reverse' ? ('عكس القيد رقم ' + src.no + (src.desc ? ' — ' + src.desc : '')) : src.desc\n    };\n  }\n\n  /* ---------- views ---------- */\n  function show(view) {\n    $('listView').hidden = view !== 'list';\n    $('editView').hidden = view !== 'edit';\n    window.scrollTo(0, 0);\n  }\n\n  var DATE_RE = /^\\d{4}-\\d{2}-\\d{2}$/;\n  function renderList() {\n    var q = $('q').value.trim().toLowerCase();\n    var st = $('fStatus').value, from = $('fFrom').value, to = $('fTo').value;\n    var body = $('listBody'); body.textContent = '';\n    var list = entries.slice().sort(function (a, b) {\n      return (parseInt(b.no, 10) || 0) - (parseInt(a.no, 10) || 0);\n    }).filter(function (e) {\n      if (q && [e.no, e.order, e.date, e.user, e.desc].join(' ').toLowerCase().indexOf(q) \u003c 0) return false;\n      if (st === 'posted' && !e.posted) return false;\n      if (st === 'draft' && e.posted) return false;\n      if (st === 'unbal' && balanced(e)) return false;\n      var okd = DATE_RE.test(e.date);\n      if (from && (!okd || e.date \u003c from)) return false;\n      if (to && (!okd || e.date > to)) return false;\n      return true;\n    });\n    var filtered = !!(q || st || from || to);\n    $('countLbl').textContent = filtered ? (list.length + ' من ' + entries.length + ' قيد') : (entries.length + ' قيد');\n    $('emptyBox').hidden = list.length > 0;\n    $('emptyMsg').textContent = entries.length ? 'لا توجد قيود مطابقة.' : 'لا توجد قيود بعد.';\n    $('emptyNew').hidden = entries.length > 0;\n    $('listFoot').hidden = list.length === 0;\n\n    var sum = 0;\n    list.forEach(function (e) {\n      var tr = el('tr');\n      tr.appendChild(el('td', 'n', e.no));\n      tr.appendChild(el('td', 'n', e.date));\n      tr.appendChild(el('td', 'desc', e.desc));\n      var dr = totals(e).dr; sum += dr;\n      tr.appendChild(el('td', 'n', fmt(dr)));\n      var s = el('td', 'tags');\n      s.appendChild(el('span', 'tag ' + (e.posted ? 'ok' : 'mut'), e.posted ? 'مرحّل' : 'مسودة'));\n      if (!balanced(e)) s.appendChild(el('span', 'tag bad', 'غير متوازن'));\n      tr.appendChild(s);\n      var a = el('td', 'acts');\n      var b1 = el('button', 'mini edit', e.posted ? 'عرض' : 'تعديل'); b1.type = 'button';\n      b1.onclick = function () { openEditor(e, false); };\n      var b2 = el('button', 'mini', 'نسخ'); b2.type = 'button'; b2.title = 'إنشاء قيد جديد بنفس البيانات';\n      b2.onclick = function () { openEditor(cloneEntry(e, 'copy'), true); dirty = true; };\n      var b3 = el('button', 'mini', 'طباعة'); b3.type = 'button';\n      b3.onclick = function () { openEditor(e, false); setTimeout(function () { window.print(); }, 150); };\n      a.appendChild(b1); a.appendChild(b2); a.appendChild(b3);\n      if (!e.posted) {\n        var b4 = el('button', 'mini del', 'مسح'); b4.type = 'button';\n        b4.onclick = function () { confirmDelete(e, function () { renderList(); }); };\n        a.appendChild(b4);\n      }\n      tr.appendChild(a);\n      body.appendChild(tr);\n    });\n    $('footLbl').textContent = 'الإجمالي (' + list.length + ' قيد)';\n    $('footVal').textContent = fmt(sum);\n  }\n\n  /* ---------- editor ---------- */\n  function addRowEl(r) {\n    r = r || {};\n    var tr = el('tr');\n    tr.appendChild(el('td'));\n    var keys = ['acc', 'cus', 'sup', 'dr', 'cr', 'emp', 'cc'];\n    var cls = { sup: 'ctr', dr: 'num dr', cr: 'num cr' };\n    keys.forEach(function (k) {\n      var v = r[k] || '';\n      if ((k === 'dr' || k === 'cr') && v) v = fmt(parse(v));\n      var td = el('td', cls[k] || '', v);\n      td.setAttribute('contenteditable', 'true'); td.setAttribute('spellcheck', 'false');\n      td.dataset.k = k;\n      tr.appendChild(td);\n    });\n    var x = el('td', 'x');\n    var b = el('button', 'rowdel', '×'); b.type = 'button'; b.title = 'حذف السطر'; b.setAttribute('aria-label', 'حذف السطر');\n    b.onclick = function () {\n      if ($('rows').children.length > 1) { tr.remove(); dirty = true; recalc(); } else { toast('لازم يفضل سطر واحد على الأقل'); }\n    };\n    x.appendChild(b); tr.appendChild(x);\n    $('rows').appendChild(tr);\n    return tr;\n  }\n  function setLocked(l) {\n    $('editView').classList.toggle('locked', l);\n    Array.prototype.forEach.call(document.querySelectorAll('#paper [contenteditable]'), function (n) {\n      n.setAttribute('contenteditable', l ? 'false' : 'true');\n    });\n    $('saveBtn').hidden = l; $('addRow').hidden = l; $('balBtn').hidden = l;\n    $('delEntryBtn').hidden = l || isNew;\n    $('copyBtn').hidden = isNew; $('revBtn').hidden = isNew;\n    $('postBtn').textContent = l ? 'إلغاء الترحيل' : 'ترحيل القيد';\n    $('postedTag').hidden = !l;\n  }\n  function openEditor(e, fresh) {\n    isNew = fresh; current = e; dirty = false;\n    $('f_no').textContent = e.no; $('f_order').textContent = e.order || '';\n    $('f_date').textContent = e.date; $('f_user').textContent = 'عمر محمد نشأت'; $('f_desc').textContent = e.desc || '';\n    $('rows').textContent = '';\n    (e.rows.length ? e.rows : [{}]).forEach(addRowEl);\n    setLocked(!!e.posted);\n    recalc(); show('edit'); fit();\n  }\n  function readEditor() {\n    var rows = [];\n    Array.prototype.forEach.call($('rows').children, function (tr) {\n      var r = {}, any = false;\n      Array.prototype.forEach.call(tr.querySelectorAll('td[data-k]'), function (td) {\n        var v = td.textContent.trim(); r[td.dataset.k] = v; if (v) any = true;\n      });\n      if (any) rows.push(r);\n    });\n    return {\n      id: current.id, no: $('f_no').textContent.trim(), order: $('f_order').textContent.trim(),\n      date: $('f_date').textContent.trim(), user: 'عمر محمد نشأت',\n      desc: $('f_desc').textContent.trim(), rows: rows, posted: !!current.posted\n    };\n  }\n  function recalc() {\n    var d = 0, c = 0;\n    $('rows').querySelectorAll('td.dr').forEach(function (t) { d += parse(t.textContent); });\n    $('rows').querySelectorAll('td.cr').forEach(function (t) { c += parse(t.textContent); });\n    d = Math.round(d * 100) / 100; c = Math.round(c * 100) / 100;\n    $('totalVal').textContent = fmt(d);\n    var s = $('status');\n    if (Math.abs(d - c) \u003c 0.005) { s.textContent = 'القيد متوازن'; s.className = 'status ok'; }\n    else { s.textContent = 'القيد غير متوازن — الفرق ' + fmt(Math.abs(d - c)); s.className = 'status bad'; }\n  }\n\n  function commit(e) {\n    if (!e.no) { toast('اكتب رقم القيد'); $('f_no').focus(); return false; }\n    var dup = entries.some(function (x) { return x.no === e.no && x.id !== e.id; });\n    if (dup) { toast('رقم القيد ' + e.no + ' موجود قبل كده'); $('f_no').focus(); return false; }\n    if (!e.rows.length) { toast('أضف سطر واحد على الأقل'); return false; }\n    var i = entries.findIndex(function (x) { return x.id === e.id; });\n    if (i > -1) entries[i] = e; else entries.push(e);\n    persist();\n    return true;\n  }\n  function save() {\n    if (current && current.posted) return;\n    var e = readEditor();\n    if (!commit(e)) return;\n    dirty = false; current = null;\n    renderList(); show('list');\n    toast('تم حفظ القيد ' + e.no);\n  }\n  function leaveEditor() { current = null; dirty = false; renderList(); show('list'); }\n\n  /* ---------- modals ---------- */\n  function closeModal() { $('overlay').textContent = ''; }\n  function modal(title, msg, build) {\n    closeModal();\n    var scrim = el('div', 'scrim');\n    var m = el('div', 'modal'); m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true');\n    m.appendChild(el('h2', '', title));\n    if (msg) m.appendChild(el('p', '', msg));\n    build(m);\n    scrim.appendChild(m);\n    scrim.addEventListener('click', function (ev) { if (ev.target === scrim) closeModal(); });\n    $('overlay').appendChild(scrim);\n    var f = m.querySelector('button.primary, button.danger, textarea'); if (f) f.focus();\n  }\n  function btn(txt, cls, fn) { var b = el('button', cls, txt); b.type = 'button'; b.onclick = fn; return b; }\n  function confirmDelete(e, after) {\n    modal('مسح القيد ' + e.no, 'هيتمسح القيد نهائياً ومش هتقدر ترجّعه. متأكد؟', function (m) {\n      var bs = el('div', 'btns');\n      bs.appendChild(btn('نعم، امسح', 'danger', function () {\n        entries = entries.filter(function (x) { return x.id !== e.id; });\n        persist(); closeModal(); if (after) after(); toast('تم مسح القيد');\n      }));\n      bs.appendChild(btn('إلغاء', '', closeModal));\n      m.appendChild(bs);\n    });\n  }\n  function backup() {\n    modal('نسخ احتياطي / استيراد', 'انسخ النص ده واحفظه في مكان آمن. علشان تسترجع القيود الصق النص هنا واضغط \"استيراد\" (هيستبدل القيود الحالية).', function (m) {\n      var ta = el('textarea'); ta.value = JSON.stringify(entries, null, 1); ta.setAttribute('aria-label', 'بيانات القيود');\n      m.appendChild(ta);\n      var bs = el('div', 'btns');\n      bs.appendChild(btn('نسخ', 'primary', function () {\n        ta.select();\n        var ok = false; try { ok = document.execCommand('copy'); } catch (x) {}\n        toast(ok ? 'تم النسخ' : 'حدد النص وانسخه يدوياً');\n      }));\n      bs.appendChild(btn('استيراد', '', function () {\n        try {\n          var a = JSON.parse(ta.value);\n          if (!Array.isArray(a)) throw 0;\n          a = a.filter(function (x) { return x && x.no != null && Array.isArray(x.rows); }).map(function (x, i) {\n            x.id = x.id || 'i' + Date.now() + i; return x;\n          });\n          entries = a; persist(); renderList(); closeModal(); toast('تم استيراد ' + a.length + ' قيد');\n        } catch (x) { toast('النص غير صالح للاستيراد'); }\n      }));\n      bs.appendChild(btn('إغلاق', '', closeModal));\n      m.appendChild(bs);\n    });\n  }\n\n  /* ---------- actions ---------- */\n  function newEntry() {\n    openEditor({ id: 'e' + Date.now(), no: nextNo(), order: '', date: today(), user: 'عمر محمد نشأت', desc: '',\n      posted: false, rows: [{}, {}] }, true);\n  }\n  function autoBalance() {\n    var d = 0, c = 0;\n    $('rows').querySelectorAll('td.dr').forEach(function (t) { d += parse(t.textContent); });\n    $('rows').querySelectorAll('td.cr').forEach(function (t) { c += parse(t.textContent); });\n    var diff = Math.round((d - c) * 100) / 100;\n    if (Math.abs(diff) \u003c 0.005) { toast('القيد متوازن بالفعل'); return; }\n    var tr = addRowEl({});\n    tr.querySelector('td[data-k=\"' + (diff > 0 ? 'cr' : 'dr') + '\"]').textContent = fmt(Math.abs(diff));\n    tr.querySelector('td[data-k=\"acc\"]').focus();\n    dirty = true; recalc();\n    toast('أضفت سطر بالفرق — اكتب اسم الحساب');\n  }\n  function togglePost() {\n    if (current.posted) {\n      var i = entries.findIndex(function (x) { return x.id === current.id; });\n      if (i > -1) { entries[i].posted = false; persist(); }\n      current.posted = false; setLocked(false);\n      toast('تم إلغاء الترحيل — تقدر تعدّل القيد'); return;\n    }\n    var e = readEditor();\n    if (!balanced(e)) { toast('لازم القيد يكون متوازن قبل الترحيل'); return; }\n    e.posted = true;\n    if (!commit(e)) return;\n    current = e; isNew = false; dirty = false; setLocked(true);\n    toast('تم ترحيل القيد ' + e.no + ' — بقى للقراءة فقط');\n  }\n  function back() {\n    if (!dirty) { leaveEditor(); return; }\n    modal('تعديلات غير محفوظة', 'في تعديلات لسه ماتحفظتش. تعمل إيه؟', function (m) {\n      var bs = el('div', 'btns');\n      bs.appendChild(btn('حفظ وخروج', 'primary', function () { closeModal(); save(); }));\n      bs.appendChild(btn('خروج بدون حفظ', 'danger', function () { closeModal(); leaveEditor(); }));\n      bs.appendChild(btn('رجوع للقيد', '', closeModal));\n      m.appendChild(bs);\n    });\n  }\n\n  /* ---------- wiring ---------- */\n  $('newBtn').onclick = newEntry;\n  $('emptyNew').onclick = newEntry;\n  $('backupBtn').onclick = backup;\n  ['q', 'fStatus', 'fFrom', 'fTo'].forEach(function (id) {\n    $(id).addEventListener('input', renderList);\n    $(id).addEventListener('change', renderList);\n  });\n  $('fReset').onclick = function () {\n    $('q').value = ''; $('fStatus').value = ''; $('fFrom').value = ''; $('fTo').value = ''; renderList();\n  };\n  $('saveBtn').onclick = save;\n  $('addRow').onclick = function () { var tr = addRowEl({}); tr.children[1].focus(); dirty = true; };\n  $('balBtn').onclick = autoBalance;\n  $('postBtn').onclick = togglePost;\n  $('copyBtn').onclick = function () { var s = readEditor(); openEditor(cloneEntry(s, 'copy'), true); dirty = true; toast('نسخة جديدة — عدّل واحفظ'); };\n  $('revBtn').onclick = function () { var s = readEditor(); openEditor(cloneEntry(s, 'reverse'), true); dirty = true; toast('قيد عكسي — راجع واحفظ'); };\n  $('printBtn').onclick = function () { window.print(); };\n  $('backBtn').onclick = back;\n  $('delEntryBtn').onclick = function () {\n    if (!current) return;\n    confirmDelete(current, function () { leaveEditor(); });\n  };\n\n  var paper = $('paper');\n  paper.addEventListener('input', function () { dirty = true; });\n  $('rows').addEventListener('input', recalc);\n  $('rows').addEventListener('focusout', function (ev) {\n    var c = ev.target;\n    if (c.classList && (c.classList.contains('dr') || c.classList.contains('cr')) && c.textContent.trim()) {\n      c.textContent = fmt(parse(c.textContent)); recalc();\n    }\n  });\n  // Enter moves down (adds a row at the end); paste as plain text\n  paper.addEventListener('keydown', function (ev) {\n    if (ev.key !== 'Enter' || !ev.target.isContentEditable) return;\n    ev.preventDefault();\n    var td = ev.target.closest ? ev.target.closest('td[data-k]') : null;\n    if (!td) return;\n    var nx = td.parentNode.nextElementSibling;\n    if (!nx) { nx = addRowEl({}); dirty = true; }\n    nx.querySelector('td[data-k=\"' + td.dataset.k + '\"]').focus();\n  });\n  paper.addEventListener('paste', function (ev) {\n    if (!ev.target.isContentEditable) return;\n    ev.preventDefault();\n    var t = ((ev.clipboardData || window.clipboardData).getData('text') || '').replace(/\\s*[\\r\\n]+\\s*/g, ' ');\n    document.execCommand('insertText', false, t);\n  });\n  document.addEventListener('keydown', function (ev) {\n    if (ev.key === 'Escape') closeModal();\n    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's' && !$('editView').hidden) {\n      ev.preventDefault(); save();\n    }\n  });\n\n  function fit() {\n    var z = Math.min(1, (document.documentElement.clientWidth - 24) / 794);\n    paper.style.zoom = z;\n  }\n  window.addEventListener('resize', fit);\n\n  entries = load();\n  renderList();\n  show('list');\n})();\n\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "labor": "\u003c!DOCTYPE html>\n\u003chtml lang=\"ar\" dir=\"rtl\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>كشف يوميات عمالة - سامكون\u003c/title>\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\">\u003c/script>\n\u003cstyle>\n:root{--ink:#17324d;--bg:#e6e9ed;--line:#222;--acc:#e8a317}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);font-family:Arial,Tahoma,sans-serif;color:#111}\n.top{background:var(--ink);color:#fff;display:flex;gap:6px;align-items:flex-end;padding:10px 20px 0;flex-wrap:wrap}\n.top select{margin-inline-start:auto;margin-bottom:8px;font:inherit;padding:6px 10px;border-radius:6px;border:0}.top button.t{font:inherit;font-weight:700;padding:10px 22px;border:0;border-radius:8px 8px 0 0;background:transparent;color:#fff;cursor:pointer}\n.top button.t.on{backgro t:12mm;display:block}.sd{position:absolute;color:#00247d;font-size:12.5px;font-weight:700;white-space:nowrap;line-height:1}#sdm{top:-1.6mm;left:50%}#sdd{right:-5mm;top:-.4mm}#sdy{left:-4mm;bottom:-3.8mm}.sg u{display:block;margin-bottom:6mm}.sg i{font-style:normal;font-weight:400;letter-spacing:1px}\n.rec{max-width:1000px;margin:0 auto;padding:0 20px 30px}\n.rec table{width:100%;border-collapse:collapse;background:#fff}\n.rec th,.rec td{border:1px solid #b9c2cc;padding:9px;text-align:center}\n.rec th{background:var(--ink);color:#fff}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}\n.cards div{background:#fff;border-inline-start:6px solid var(--acc);padding:12px;border-radius:6px}\n.cards b{display:block;font-size:26px;color:var(--ink)}\n.rec .d{color:#b3261e;border-color:#b3261e}\n.em{padding:30px;text-align:center;background:#fff;border-radius:6px}\n#v2,#v3{display:none}#pk{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:center;justify-content:center}#pk.on{display:flex}.pkb{background:#fff;width:min(560px,94vw);max-height:88vh;display:flex;flex-direction:column;border-radius:10px;padding:8px}#pkl{overflow:auto;flex:1;margin:6px 0}.pi{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid #dde;cursor:pointer;font-size:16px}.pi input{width:22px;height:22px}.pi small{margin-inline-start:auto;color:#555}.pi.done{opacity:.5}.pkb h3{margin:6px 10px;color:var(--ink)}#sgb{position:fixed;z-index:9;background:#fff;border:1px solid var(--ink);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none;max-height:240px;overflow:auto;font-size:14px}#sgb div{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:14px}#sgb div:hover,#sgb div.on{background:#fff1cc}#sgb small{color:#555}.rec td[contenteditable]:focus{outline:2px solid var(--acc)}.rec textarea{font:inherit;flex:1;min-width:240px;padding:8px;border:1px solid var(--i
